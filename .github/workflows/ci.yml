name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            rails: "7_1"
          - ruby: "3.4"
            rails: "8_1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ matrix.ruby }}-${{ matrix.rails }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ matrix.ruby }}-${{ matrix.rails }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Run test suite
        run: bundle exec rake app:spec

      - name: Build gem package
        run: bundle exec gem build venus_media_library.gemspec

      - name: Validate gem package
        run: gem check venus_media_library-*.gem
